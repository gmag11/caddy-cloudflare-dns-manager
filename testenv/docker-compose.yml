services:
  caddy:
    build:
      # Build context is the repo root so the Dockerfile can COPY go.mod,
      # go.sum and the root-level plugin package. The plugin source is baked
      # into the image at build time only; it is not mounted at runtime.
      context: ..
      dockerfile: testenv/Dockerfile
      args:
        CADDY_VERSION: "2.11.4"
    image: caddy-cfdnsmanager-test:local
    container_name: caddy-cfdnsmanager-test
    env_file:
      - .env
    volumes:
      # Only the Caddyfile is mounted, read-only. The plugin source is baked
      # into the image and is not bind-mounted from the repo.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist ACME certificates/keys across restarts.
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - default
    depends_on:
      - cloudflared
    restart: "no"

  # cloudflared runs the remotely-managed test tunnel. It connects outbound to
  # Cloudflare's edge (no published ports) and forwards ingress-matching
  # requests to https://caddy:443 inside the compose network.
  #
  # The tunnel is remotely-managed, so its ingress rules live on Cloudflare and
  # are written by the plugin itself (the `account` block in the Caddyfile plus
  # the `tunnel <name>` declarations plus the global tunnel registry). There is
  # no config.yml: a remotely-managed
  # connector ignores `--config` and takes its identity from the token.
  #
  # One-time setup: create the tunnel in the dashboard (Networking > Tunnels >
  # Create a tunnel > Cloudflared) and copy the run token into CF_TUNNEL_TOKEN
  # and the tunnel UUID into CF_TUNNEL_ID in testenv/.env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cfdns-cloudflared-test
    command: >
      tunnel --no-autoupdate
      run --token ${CF_TUNNEL_TOKEN}
    env_file:
      - .env
    networks:
      - default
    restart: "no"

volumes:
  caddy_data:
  caddy_config:

networks:
  # User-defined bridge with IPv6 enabled. The subnet is allocated from the
  # daemon's default-address-pools (fd00::/56 -> fd00::/64); Docker NAT66s
  # outbound traffic to the host's global IPv6. Enables `ip6 auto` detection
  # inside the container.
  default:
    enable_ipv6: true

